[package]
name = "noriter-ai"
version = "0.1.5"
description = "Noriter AI - offline AI assistant with Telegram bridge"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
futures = "0.3"
dirs = "5"
anyhow = "1"
base64 = "0.22"
calamine = "0.26"
chrono = { version = "0.4", features = ["clock"] }
# OpenDART's corpCode endpoint returns a zipped XML document, so both are
# needed to read it. Already in the build graph via calamine, so adding them
# as direct dependencies costs no extra compilation.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[[bin]]
name = "noriter-ai"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
